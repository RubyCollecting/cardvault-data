# Card Vault data mirror
# Copies Cardmarket's Yu-Gi-Oh price guide and product catalogues, plus the
# yaml-yugi card database, twice a day (08:30 and 16:30 UTC) and publishes them on this repository's
# GitHub Pages address, where the Card Vault page is allowed to read them.
# The same is done for Pokémon in the pokemon/ folder: Cardmarket's Pokémon files and a card list
# built from TCGdex's open card database.
# Rush Duel card prices come from TCG Republic once a day (scripts/rush-prices.py).

name: Mirror Cardmarket data

on:
  schedule:
    - cron: "30 8 * * *"    # daily 08:30 UTC, after Cardmarket's morning price update
    - cron: "30 16 * * *"   # second try later in the day, in case the first was early
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # to record the last run (keeps the daily schedule active)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Download Cardmarket files
        run: |
          set -euo pipefail
          mkdir -p site
          base=https://downloads.s3.cardmarket.com/productCatalog
          curl -fsSL --retry 3 --retry-delay 10 -o site/price_guide_3.json        "$base/priceGuide/price_guide_3.json"
          curl -fsSL --retry 3 --retry-delay 10 -o site/products_singles_3.json    "$base/productList/products_singles_3.json"
          curl -fsSL --retry 3 --retry-delay 10 -o site/products_nonsingles_3.json "$base/productList/products_nonsingles_3.json"
          # fail the run if any file is not valid JSON, so a broken copy is never published
          python3 -c "import json,sys;[json.load(open('site/'+f)) for f in sys.argv[1:]]" \
            price_guide_3.json products_singles_3.json products_nonsingles_3.json
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"updated\":\"$now\"}" > site/status.json
          ls -la site

      - name: Download Cardmarket Pokémon files
        # Same three files for Pokémon, into pokemon/. If Cardmarket fails here, Yu-Gi-Oh! still publishes
        # and the app keeps the Pokémon prices it already has.
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p site/pokemon
          base=https://downloads.s3.cardmarket.com/productCatalog
          if curl -fsSL --retry 3 --retry-delay 10 -o site/pokemon/price_guide_6.json        "$base/priceGuide/price_guide_6.json" \
             && curl -fsSL --retry 3 --retry-delay 10 -o site/pokemon/products_singles_6.json    "$base/productList/products_singles_6.json" \
             && curl -fsSL --retry 3 --retry-delay 10 -o site/pokemon/products_nonsingles_6.json "$base/productList/products_nonsingles_6.json" \
             && python3 -c "import json,sys;[json.load(open('site/pokemon/'+f)) for f in sys.argv[1:]]" \
                  price_guide_6.json products_singles_6.json products_nonsingles_6.json; then
            ls -la site/pokemon
          else
            rm -f site/pokemon/*_6.json
            echo "::warning::Cardmarket's Pokémon files could not be copied this run"
          fi

      - name: Record last run
        # GitHub pauses scheduled workflows in repositories with no activity for 60 days.
        # A tiny commit each run counts as activity and keeps the schedule running.
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > last-run.txt
          git config user.name "card-vault-bot"
          git config user.email "card-vault-bot@users.noreply.github.com"
          git add last-run.txt
          git commit -m "Mirror run $(date -u +%F)" || echo "Nothing to commit"
          git push || echo "Push skipped"

      - name: Keep daily price history
        # Every day's prices are kept for good on the price-history branch of this repository,
        # and the last 45 days are published in history/. If that branch can't be reached,
        # the published days are carried over from the live site instead, as before.
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -uo pipefail
          # Actions runs this with bash -e, so keep the "branch not found" exit code (2) from ending the step
          found=0; git ls-remote --exit-code --heads origin price-history >/dev/null || found=$?
          archive=""
          if [ $found -eq 0 ] && git fetch --depth=1 origin price-history \
             && git worktree add archive FETCH_HEAD; then
            archive=archive
          elif [ $found -eq 2 ] && git worktree add --orphan -b price-history archive; then
            echo "Starting the price-history branch"; archive=archive
          else
            echo "::warning::Price archive unreachable, carrying history over from the live site only"
          fi
          python3 scripts/history.py site "$archive" || exit 1
          if [ -f site/pokemon/price_guide_6.json ]; then
            python3 scripts/history.py site "$archive" pokemon \
              || echo "::warning::Pokémon price history could not be updated this run"
          fi
          if [ -n "$archive" ]; then
            cd archive
            git add -A .
            if git commit -qm "Prices $(date -u +%F)"; then
              git push origin HEAD:refs/heads/price-history \
                || echo "::warning::Could not save today's prices to the price-history branch"
            fi
          fi

      - name: Card database (yaml-yugi)
        # Copies the yaml-yugi card list so the app can read it from this site too.
        # If yaml-yugi is down or sends a broken file, the copy from the last run is
        # kept instead, and the prices still publish either way.
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -uo pipefail
          check='import json,sys;j=json.load(open(sys.argv[1]));sys.exit(0 if isinstance(j,list) and len(j)>100 and any(isinstance(c,dict) and c.get("name") and c.get("sets") for c in j[:50]) else 1)'
          if curl -fsSL --retry 3 --retry-delay 10 -o site/cards.json https://dawnbrandbots.github.io/yaml-yugi/cards.json \
             && python3 -c "$check" site/cards.json; then
            echo "Copied the latest card database"
          elif curl -fsSL --retry 3 --retry-delay 10 -o site/cards.json "${PAGES_URL%/}/cards.json" \
             && python3 -c "$check" site/cards.json; then
            echo "::warning::yaml-yugi could not be copied, kept the copy from the last run"
          else
            rm -f site/cards.json
            echo "::warning::No card database this run (yaml-yugi and the previous copy were both unavailable)"
          fi
          ls -la site/cards.json 2>/dev/null || true

      - name: Set up Bun
        # TCGdex keeps its card database as TypeScript files; Bun reads them directly
        continue-on-error: true
        uses: oven-sh/setup-bun@v2

      - name: Pokémon card database (TCGdex)
        # Builds pokemon/cards.json from TCGdex's open card database (MIT licence): every English and
        # Japanese card with its set, number, rarity, picture and Cardmarket product ids. If TCGdex
        # can't be read, the copy from the last run is kept.
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -uo pipefail
          mkdir -p site/pokemon
          check='import json,sys;j=json.load(open(sys.argv[1]));sys.exit(0 if len(j.get("cards",[]))>10000 and len(j.get("sets",[]))>100 else 1)'
          curl -fsSL --retry 3 --retry-delay 10 -o tcgdex-assets.json https://assets.tcgdex.net/datas.json || rm -f tcgdex-assets.json
          singles=site/pokemon/products_singles_6.json
          if git clone -q --depth 1 https://github.com/tcgdex/cards-database.git tcgdex \
             && bun scripts/pokemon-cards.ts tcgdex site/pokemon/cards.json "$( [ -f tcgdex-assets.json ] && echo tcgdex-assets.json )" "$( [ -f $singles ] && echo $singles )" \
             && python3 -c "$check" site/pokemon/cards.json; then
            echo "Built the Pokémon card database"
          elif curl -fsSL --retry 3 --retry-delay 10 -o site/pokemon/cards.json "${PAGES_URL%/}/pokemon/cards.json" \
             && python3 -c "$check" site/pokemon/cards.json; then
            echo "::warning::TCGdex could not be read, kept the Pokémon card database from the last run"
          else
            rm -f site/pokemon/cards.json
            echo "::warning::No Pokémon card database this run"
          fi
          rm -rf tcgdex tcgdex-assets.json
          ls -la site/pokemon/cards.json 2>/dev/null || true

      - name: Yu-Gi-Oh! news
        # Collects the feeds listed in news-feeds.txt. If a news site is down, the rest still publishes.
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/news.py site

      - name: Pokémon news
        # Collects the feeds listed in pokemon-news-feeds.txt into pokemon/news.json.
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/news.py site --game pokemon

      - name: Rush Duel prices (TCG Republic)
        # Cardmarket sells no Rush Duel singles, so their prices come from TCG Republic's Rush Duel
        # listing pages, read slowly (a pause between pages) and only once a day: the later run copies
        # the morning's file. If the shop can't be read, the last published prices are kept.
        continue-on-error: true
        timeout-minutes: 30
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/rush-prices.py site

      - name: Upload files for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
