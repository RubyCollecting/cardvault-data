# Card Vault data mirror
# Copies Cardmarket's Yu-Gi-Oh price guide and product catalogues, plus the
# yaml-yugi card database, once a day and publishes them on this repository's
# GitHub Pages address, where the Card Vault page is allowed to read them.

name: Mirror Cardmarket data

on:
  schedule:
    - cron: "30 8 * * *"    # daily 08:30 UTC, after Cardmarket's morning price update
    - cron: "30 16 * * *"   # second try later in the day, in case the first was early
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # to record the last run (keeps the daily schedule active)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Download Cardmarket files
        run: |
          set -euo pipefail
          mkdir -p site
          base=https://downloads.s3.cardmarket.com/productCatalog
          curl -fsSL --retry 3 --retry-delay 10 -o site/price_guide_3.json        "$base/priceGuide/price_guide_3.json"
          curl -fsSL --retry 3 --retry-delay 10 -o site/products_singles_3.json    "$base/productList/products_singles_3.json"
          curl -fsSL --retry 3 --retry-delay 10 -o site/products_nonsingles_3.json "$base/productList/products_nonsingles_3.json"
          # fail the run if any file is not valid JSON, so a broken copy is never published
          python3 -c "import json,sys;[json.load(open('site/'+f)) for f in sys.argv[1:]]" \
            price_guide_3.json products_singles_3.json products_nonsingles_3.json
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"updated\":\"$now\"}" > site/status.json
          ls -la site

      - name: Record last run
        # GitHub pauses scheduled workflows in repositories with no activity for 60 days.
        # A tiny commit each run counts as activity and keeps the schedule running.
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > last-run.txt
          git config user.name "card-vault-bot"
          git config user.email "card-vault-bot@users.noreply.github.com"
          git add last-run.txt
          git commit -m "Mirror run $(date -u +%F)" || echo "Nothing to commit"
          git push || echo "Push skipped"

      - name: Keep daily price history (last 45 days)
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          base = os.environ.get("PAGES_URL", "").rstrip("/") + "/"
          pg = json.load(open("site/price_guide_3.json"))
          day = pg["createdAt"][:10]
          os.makedirs("site/history", exist_ok=True)
          rows = []
          for x in pg["priceGuides"]:
              v = next((x.get(k) for k in ("trend", "avg30", "avg7", "low") if x.get(k) is not None), None)
              if v is not None:
                  rows.append((x["idProduct"], round(v, 2)))
          rows.sort()
          deltas, prev = [], 0
          for pid, _ in rows:
              deltas.append(pid - prev); prev = pid
          json.dump({"date": day, "d": deltas, "p": [v for _, v in rows]},
                    open(f"site/history/{day}.json", "w"), separators=(",", ":"))
          dates = {day}
          today = datetime.date.fromisoformat(day)
          try:
              old = json.load(urllib.request.urlopen(base + "history/index.json", timeout=30)).get("dates", [])
          except Exception as e:
              print("No earlier history yet:", e); old = []
          for d in old:
              if d in dates or (today - datetime.date.fromisoformat(d)).days > 45:
                  continue
              try:
                  data = urllib.request.urlopen(base + f"history/{d}.json", timeout=60).read()
                  open(f"site/history/{d}.json", "wb").write(data); dates.add(d)
              except Exception as e:
                  print("Could not carry over", d, e)
          json.dump({"dates": sorted(dates)}, open("site/history/index.json", "w"))
          print("History days:", len(dates))
          PY

      - name: BIGWEB prices for OCG sets
        # Japanese shop prices (yen, with euro rate) for the sets listed in scripts/bigweb-sets.txt.
        # If BIGWEB can't be reached, yesterday's prices are kept and the rest still publishes.
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/bigweb.py site

      - name: Card database (yaml-yugi)
        # Copies the yaml-yugi card list so the app can read it from this site too.
        # If yaml-yugi is down or sends a broken file, the copy from the last run is
        # kept instead, and the prices still publish either way.
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -uo pipefail
          check='import json,sys;j=json.load(open(sys.argv[1]));sys.exit(0 if isinstance(j,list) and len(j)>100 and any(isinstance(c,dict) and c.get("name") and c.get("sets") for c in j[:50]) else 1)'
          if curl -fsSL --retry 3 --retry-delay 10 -o site/cards.json https://dawnbrandbots.github.io/yaml-yugi/cards.json \
             && python3 -c "$check" site/cards.json; then
            echo "Copied the latest card database"
          elif curl -fsSL --retry 3 --retry-delay 10 -o site/cards.json "${PAGES_URL%/}/cards.json" \
             && python3 -c "$check" site/cards.json; then
            echo "::warning::yaml-yugi could not be copied, kept the copy from the last run"
          else
            rm -f site/cards.json
            echo "::warning::No card database this run (yaml-yugi and the previous copy were both unavailable)"
          fi
          ls -la site/cards.json 2>/dev/null || true

      - name: Yu-Gi-Oh! news
        # Collects the feeds listed in news-feeds.txt. If a news site is down, the rest still publishes.
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/news.py site

      - name: Upload files for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
