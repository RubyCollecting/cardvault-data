# Temporary check of how Yugipedia marks Rush Duel and GX products. Runs only on this branch.
name: Probe release sources
on:
  push:
    branches: [claude/project-thread-r6bs6s]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="CardVault/1.0 (personal collection app; github.com/RubyCollecting)"
          y="https://yugipedia.com/api.php"
          for cond in "[[Japanese release date::>2026-09-01]]" "[[English release date::>2026-09-01]]"; do
            echo "=== $cond"
            curl -sS -A "$UA" -G "$y" --data-urlencode "action=ask" --data-urlencode "format=json" --data-urlencode "query=$cond|?Medium|?Set type|?Series|?Japanese set prefix|?English set prefix|limit=250" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['query']['results']
          def t(v): return [x.get('fulltext',x) if isinstance(x,dict) else x for x in v]
          for k,v in d.items():
            p=v['printouts'];print(k,'|',t(p.get('Medium',[])),'|',t(p.get('Set type',[])),'|',t(p.get('Series',[])),'|',p.get('Japanese set prefix'),p.get('English set prefix'))"
          done
