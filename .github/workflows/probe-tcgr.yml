name: Probe TCG Republic (temporary)
on:
  push:
    branches: [claude/project-thread-urc3ln]
    paths: [.github/workflows/probe-tcgr.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Full run of the Rush price script
        env:
          PAGES_URL: https://rubycollecting.github.io/cardvault-data/
        run: |
          mkdir -p site probe
          time python3 scripts/rush-prices.py site
          cp site/rush-prices.json probe/ && ls -la probe
          git config user.name card-vault-bot; git config user.email card-vault-bot@users.noreply.github.com
          git add probe && git commit -qm "Temporary probe: Rush prices" && git push
